<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホームランダービー</title>
  <style>
    :root {
      color-scheme: light;
      --bg-a: #0b1020;
      --bg-b: #1f6f8b;
      --panel: rgba(255, 255, 255, 0.14);
      --border: rgba(255, 255, 255, 0.22);
      --text: #f6f7fb;
      --muted: rgba(246, 247, 251, 0.72);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.18), transparent 32%),
        linear-gradient(135deg, var(--bg-a), var(--bg-b));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(100%, 1080px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    header {
      padding: 20px 24px 12px;
    }

    .topbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
      letter-spacing: 0.04em;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .volume-panel {
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(7, 11, 24, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .volume-label {
      display: block;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .volume-value {
      min-width: 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .volume-slider {
      flex: 1;
      accent-color: #ffd166;
      cursor: pointer;
    }

    #game-shell {
      padding: 8px 24px 24px;
    }

    #game-frame {
      width: 100%;
      aspect-ratio: 800 / 600;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(7, 11, 24, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    ruffle-player,
    #game-frame > div {
      width: 100%;
      height: 100%;
      display: block;
    }

    @media (max-width: 720px) {
      body {
        padding: 12px;
      }

      header,
      #game-shell {
        padding-left: 14px;
        padding-right: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <div>
          <h1>ホームランダービー</h1>
          <p>Ruffle で `homerun.swf` をブラウザ再生しています。</p>
        </div>
        <div class="volume-panel">
          <label class="volume-label" for="volume-slider">Volume</label>
          <div class="volume-row">
            <input
              id="volume-slider"
              class="volume-slider"
              type="range"
              min="0"
              max="100"
              value="100"
              aria-label="音量"
            >
            <output id="volume-value" class="volume-value" for="volume-slider">100%</output>
          </div>
        </div>
      </div>
    </header>
    <section id="game-shell">
      <div id="game-frame"></div>
    </section>
  </main>

  <script>
    const VOLUME_KEY = "homerun-volume";

    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("DOMContentLoaded", () => {
      const slider = document.getElementById("volume-slider");
      const value = document.getElementById("volume-value");
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const frame = document.getElementById("game-frame");

      const updateVolumeLabel = (amount) => {
        value.value = amount + "%";
        value.textContent = amount + "%";
      };

      const setPlayerVolume = (amount) => {
        const clamped = Math.max(0, Math.min(100, amount));
        player.volume = clamped / 100;
        slider.value = String(clamped);
        updateVolumeLabel(clamped);
        localStorage.setItem(VOLUME_KEY, String(clamped));
      };

      const savedVolume = Number(localStorage.getItem(VOLUME_KEY));
      const initialVolume = Number.isFinite(savedVolume) ? savedVolume : 100;

      frame.appendChild(player);
      setPlayerVolume(initialVolume);
      player.ruffle().load("homerun.swf");

      slider.addEventListener("input", (event) => {
        setPlayerVolume(Number(event.target.value));
      });
    });
  </script>
  <script src="./ruffle/ruffle.js"></script>
</body>
</html>
